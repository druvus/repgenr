# Copy to tests/live/live.local.toml (gitignored) and adjust for this machine.
# Run: pytest tests/live -m live --live-config tests/live/live.local.toml

# Where network fixtures cache their downloads and where junit output goes.
cache_dir = "/Volumes/sekvens2/repgenr/live-cache"

# Tool directories, keyed by the tool they provide. Run pytest in the core
# environment (envs/core.yml); its tools need no entry. A key that names a
# repgenr tool goes to REPGENR_BIN_DIRS (--bin-dir), so that directory comes
# first on PATH for that tool only; any other key (nextflow) is appended to
# PATH. A satellite therefore never shadows core's samtools and bcftools.
[bin_dirs]
gubbins = "~/miniforge3/envs/repgenr-gubbins/bin"
mashtree = "~/miniforge3/envs/repgenr-mashtree/bin"
snippy = "~/miniforge3/envs/repgenr-snippy/bin"
parsnp = "~/miniforge3/envs/repgenr-parsnp/bin"
# simple = "~/miniforge3/envs/repgenr_snptools/bin"  # only if the pytest env has a pre-1.10 samtools
nextflow = "~/miniforge3/envs/repgenr_nf/bin"
